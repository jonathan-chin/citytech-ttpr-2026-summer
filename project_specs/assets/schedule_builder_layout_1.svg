<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <rect x="8" y="8" width="624" height="384" rx="8" fill="#ffffff" stroke="#cccccc"/>

  <text x="28" y="40" font-size="18" font-weight="bold" fill="#1a1a1a">College Schedule Builder</text>

  <!-- input panel -->
  <rect x="28" y="56" width="584" height="104" rx="6" fill="#f7f7f9" stroke="#e0e0e0"/>
  <text x="42" y="78" font-size="13" font-weight="bold" fill="#2e75b6">Add a course</text>

  <text x="42" y="100" font-size="10" fill="#888">Course name</text>
  <rect x="42" y="106" width="250" height="26" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="50" y="123" font-size="11" fill="#bbb">e.g. Intro to CS</text>

  <text x="306" y="100" font-size="10" fill="#888">Day</text>
  <rect x="306" y="106" width="104" height="26" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="314" y="123" font-size="11" fill="#666">Tuesday</text>
  <path d="M396 115 l8 0 l-4 6 z" fill="#999"/>

  <text x="424" y="100" font-size="10" fill="#888">Start</text>
  <rect x="424" y="106" width="78" height="26" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="432" y="123" font-size="11" fill="#666">2:00pm</text>

  <text x="516" y="100" font-size="10" fill="#888">End</text>
  <rect x="516" y="106" width="78" height="26" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="524" y="123" font-size="11" fill="#666">3:00pm</text>

  <rect x="42" y="140" width="76" height="14" rx="0" fill="none"/>
  <rect x="42" y="138" width="78" height="16" rx="4" fill="#2e75b6"/>
  <text x="81" y="150" font-size="10" fill="#fff" text-anchor="middle">+ Add</text>

  <!-- list -->
  <text x="28" y="190" font-size="14" font-weight="bold" fill="#1a1a1a">Your Courses</text>

  <rect x="28" y="200" width="584" height="38" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="44" y="218" font-size="12" font-weight="bold" fill="#1a1a1a">Intro to CS</text>
  <text x="44" y="232" font-size="10" fill="#777">Tuesday · 2:00pm – 3:00pm</text>

  <rect x="28" y="244" width="584" height="38" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="44" y="262" font-size="12" font-weight="bold" fill="#1a1a1a">Calculus I</text>
  <text x="44" y="276" font-size="10" fill="#777">Monday · 10:00am – 11:30am</text>

  <rect x="28" y="288" width="584" height="38" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="44" y="306" font-size="12" font-weight="bold" fill="#1a1a1a">English Composition</text>
  <text x="44" y="320" font-size="10" fill="#777">Wednesday · 1:00pm – 2:15pm</text>

  <rect x="28" y="332" width="584" height="38" rx="6" fill="#fafafa" stroke="#ececec" stroke-dasharray="4 3"/>
  <text x="44" y="355" font-size="11" fill="#bbb">…more courses appear here as they're added</text>
</svg>
